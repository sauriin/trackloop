<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e14" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Track office tasks, gym, nutrition, investments and reminders in one place." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TrackLoop" />
  <title>TrackLoop — daily tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 512 512" width="24" height="24" fill="none">
          <circle cx="256" cy="256" r="150" stroke="#4ade80" stroke-width="34" stroke-linecap="round"
                  stroke-dasharray="760 190" transform="rotate(-90 256 256)" />
          <path d="M206 260l34 34 70-74" stroke="#0a0e14" stroke-width="34"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <div class="brand-text">
        <h1>TrackLoop</h1>
        <p>tasks · gym · food · money</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="notify-btn" class="icon-btn" title="Enable notifications" aria-label="Enable notifications">🔔</button>
      <button id="install-btn" class="icon-btn accent hidden" title="Install app" aria-label="Install app">⬇</button>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#today" data-tab="today"><span>🏠</span>Today</a>
    <a href="#office" data-tab="office"><span>🗂️</span>Office</a>
    <a href="#gym" data-tab="gym"><span>🏋️</span>Gym</a>
    <a href="#nutrition" data-tab="nutrition"><span>🥗</span>Food</a>
    <a href="#money" data-tab="money"><span>📈</span>Money</a>
    <a href="#reminders" data-tab="reminders"><span>⏰</span>Alerts</a>
  </nav>

  <noscript><p style="padding:24px;color:#8d9bad">TrackLoop needs JavaScript enabled.</p></noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
